name: build
on: [push, workflow_dispatch]

jobs:
    build-rpm:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repository
              uses: actions/checkout@v7
            - name: setup python
              uses: actions/setup-python@v7
              with:
                python-version: 3.12
            - name: setup Node.js
              uses: actions/setup-node@v7
              with:
                cache-dependency-path: integration-runner/package-lock.json
                node-version: 22.1
                cache: npm
            - name: install rpm tooling
              run: sudo apt-get update && sudo apt-get install -y rpm
            - name: install dependencies
              run: |
                pip install -r requirements.txt --upgrade
                maturin build --release
                pip install $(find ./target/wheels/*.whl)
                cd integration-runner
                npm i
            - name: build
              run: |
                pyinstaller framewriter.py --onedir --name=frame-writer
                pyinstaller hardwareserver.py --onedir --name=hardware-server
                cd integration-runner
                npm run package
            - name: package
              run: |
                mkdir -p dist/liquidWeb
                mkdir -p dist/liquidWeb/bin
                mkdir -p dist/liquidWeb/systemd
                mv dist/frame-writer dist/liquidWeb/bin/
                mv dist/hardware-server dist/liquidWeb/bin/
                mv integration-runner/out/integration-runner-linux-x64 dist/liquidWeb/integration-runner
                cp systemd/*.service dist/liquidWeb/systemd/
                cp systemd/*.target dist/liquidWeb/systemd/
                cp 99-liquidWeb.rules dist/liquidWeb/
                cp liquidWeb-configure-integration.sh dist/liquidWeb/bin/
            - name: prepare rpm sources
              run: |
                VERSION=$(rpmspec -q --qf '%{version}' liquidWeb.spec)
                mkdir -p rpmbuild/SOURCES
                cp -r dist/liquidWeb liquidWeb-$VERSION
                tar czf rpmbuild/SOURCES/liquidWeb-$VERSION.tar.gz liquidWeb-$VERSION
            - name: build rpm
              run: |
                rpmbuild \
                    --define "_topdir $(pwd)/rpmbuild" \
                    -ba liquidWeb.spec
            - uses: actions/upload-artifact@v7
              with:
                name: liquidWeb-rpm
                path: rpmbuild/RPMS/**/*.rpm